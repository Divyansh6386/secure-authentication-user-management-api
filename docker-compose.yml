# Local development dependencies.
#
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# The credentials below match the `local` profile defaults in
# application-local.yml, so the app connects with no .env needed.
services:
  db:
    image: postgres:16-alpine
    container_name: starter-db
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - starter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starter"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional lightweight DB browser at http://localhost:8081
  adminer:
    image: adminer:4
    container_name: starter-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  starter-db-data:
