spring:
  datasource:
    url: jdbc:h2:mem:starter;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      # Schema is generated from the entities for tests; Flyway (Postgres-only
      # migrations) stays off so the context loads without a real database.
      ddl-auto: create-drop

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    access-exp-minutes: 15
    refresh-exp-days: 7
  cors:
    allowed-origins: http://localhost:3000
  rate-limit:
    # Disabled so the suite is not throttled across many requests; the limiter
    # itself is covered by RateLimitingServiceTest.
    enabled: false
